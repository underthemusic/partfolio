
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <link rel="stylesheet" href="team.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
</head>
<body>

    <section class="contact">

        <!-- LEFT SIDE -->

        <div class="contact-form">

            <h2>Biz bilan <span>Bog'lanish</span></h2>

            <form>

                <div class="input-group">
                    <label>Ism-sharifingiz</label>
                    <input type="text" placeholder="Ism-sharifingizni kiriting">
                </div>

                <div class="input-group">
                    <label>Email-manzil</label>
                    <input type="email" placeholder="Email-manzilingizni kiriting">
                </div>

                <div class="input-group">
                    <label>Telefon Raqam</label>
                    <input type="tel" placeholder="Telefon raqamingizni kiriting">
                </div>

                <div class="input-group">
                    <label>Xabar</label>
                    <textarea placeholder="Bu yerga xabar qoldiring..."></textarea>
                </div>

                <button type="submit">Xabar yuborish</button>

            </form>

        </div>




        <div class="contact-info">

            <h2>Bog'lanish uchun malumotlar</h2>

            <div class="info-item">
                <i class='bx bx-map'></i>
                <p>23-uy Yunusobod, Toshkent, O'zbekiston</p>
            </div>

            <div class="info-item">
                <i class='bx bx-envelope'></i>
                <p>info@xariduz.com</p>
            </div>

            <div class="info-item">
                <i class='bx bx-phone'></i>
                <p>+998 069 09 69</p>
            </div>



            <div class="social-icons">

                <a href="#"><i class='bx bxl-instagram'></i></a>

                <a href="#"><i class='bx bxl-twitter'></i></a>

                <a href="#"><i class='bx bxl-facebook-circle'></i></a>

                <a href="#"><i class='bx bxl-linkedin'></i></a>

            </div>

        </div>

    </section>

</body>
</html>
